name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: ブランチ名のチェック
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: ブランチ名が規約に沿っているか確認
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feature|fix|chore|docs|refactor|test)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$BRANCH" =~ $pattern ]]; then
            echo "::error::ブランチ名 '$BRANCH' が規約に沿っていません。<prefix>/<Issue番号>-<英語ケバブケース> の形式にしてください（CONTRIBUTING.md 参照）。"
            exit 1
          fi
          echo "OK: $BRANCH"

  commitlint:
    name: コミットメッセージのチェック
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: PR 内の全コミットを検証
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  check:
    name: lint・整形・型チェック・ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm run build
